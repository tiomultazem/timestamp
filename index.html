<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timestamp Helper</title>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Timestamp Helper</h1>
    <button id="btnDownload" style="width: auto; padding: 8px 16px;">Unduh Foto</button>
  </header>
  <div class="container">
    <div class="sidebar">
      <div class="panel">
        <h2>1. Upload Foto</h2>
        <input type="file" id="inputImage" accept="image/*">
      </div>

      <div class="panel">
        <h2>2. Ukuran Frame Canvas</h2>
        <label>Rasio Frame
          <select id="selectAspect">
            <option value="1:1">1 : 1 (Square)</option>
            <option value="4:5">4 : 5 (Instagram Post)</option>
            <option value="16:9">16 : 9 (Landscape)</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <div class="row" id="customDims" style="display:none;">
          <label>Lebar (px) <input type="number" id="canvasW" value="1080"></label>
          <label>Tinggi (px) <input type="number" id="canvasH" value="1080"></label>
        </div>
      </div>

      <div class="panel">
        <h2>3. Kontrol Foto</h2>
        <label>Zoom Foto (Scroll di Canvas)
          <input type="range" id="photoScale" min="0.1" max="5" step="0.01" value="1">
        </label>
        <button id="btnResetPhoto">Reset Posisi & Zoom</button>
      </div>

      <div class="panel">
        <h2>4. Teks & Layer (Max 10)</h2>
        <label>Pilih Layer Teks
          <select id="selectLayer"></select>
        </label>
        <div class="row">
          <button id="btnAddLayer" class="btn-secondary">+ Teks Baru</button>
          <button id="btnDeleteLayer" class="btn-danger">- Hapus Layer</button>
        </div>
        <label>Status Teks
          <select id="selectTextMode">
            <option value="show">Tampilkan Teks</option>
            <option value="hide">Hapus / Sembunyikan Teks</option>
          </select>
        </label>
        <label>Isi Teks (Multi-line Enter Supported)
          <textarea id="textValue" rows="3" placeholder="Upload foto untuk EXIF / Ketik teks..."></textarea>
        </label>
        <div class="row">
          <label>Ukuran Font <input type="number" id="textSize" value="36" min="10" max="200"></label>
          <label>Warna Teks <input type="color" id="textColor" value="#ffffff"></label>
        </div>
        <div class="row">
          <label>Background Teks <input type="color" id="textBgColor" value="#000000"></label>
          <label>Transparansi BG <input type="range" id="textBgAlpha" min="0" max="1" step="0.05" value="0.5"></label>
        </div>
      </div>
    </div>

    <div class="preview-area">
      <canvas id="mainCanvas"></canvas>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
